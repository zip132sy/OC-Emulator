<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OC Emulator - Web 控制面板</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <div id="app" class="app">
    <!-- 顶部菜单栏 (VMware Workstation 风格) -->
    <header class="top-bar">
      <button class="menu-btn nav-toggle" data-action="toggle-nav" aria-label="虚拟机库">☰</button>
      <div class="brand">
        <span class="brand-logo">⬣</span>
        <span class="brand-name">OC Emulator</span>
        <span class="brand-sub err" id="lua-badge" title="Lua 解释器状态">Lua: 错误</span>
      </div>
      <nav class="menu">
        <button class="menu-btn" id="menu-new-vm" data-action="new-vm">＋ New VM</button>
        <button class="menu-btn" id="menu-import-vm" data-action="import-vm">📥 Import VM</button>
        <button class="menu-btn" id="menu-refresh" data-action="refresh">⟳ Refresh</button>
        <button class="menu-btn" id="menu-lua-recheck" data-action="lua-recheck">⟳ Recheck Lua</button>
        <button class="menu-btn" id="menu-settings" data-action="settings">⚙ Settings</button>
        <button class="menu-btn" id="menu-restart-server" data-action="restart-server">⟳ Restart service</button>
        <button class="menu-btn danger" id="menu-stop-server" data-action="stop-server">■ Stop service</button>
      </nav>
      <div class="conn-status " id="conn-status">WS: Connecting…</div>
    </header>

    <main class="main">
      <!-- 左侧: VM 库 -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 id="vm-list-title">VM Library</h2>
          <span class="vm-count" id="vm-count">0</span>
        </div>
        <ul class="vm-list" id="vm-list">
          <li class="vm-empty" id="vm-empty-text">暂无虚拟机<br>点击「新建虚拟机」开始</li>
        </ul>
      </aside>

      <!-- 中央: 标签页区域 -->
      <section class="content">
        <nav class="tabs" id="tabs-bar"></nav>
        <div class="tab-content" id="tab-content">
          <div class="welcome">
            <div class="welcome-logo">⬣</div>
            <h1 id="welcome-title">OC Emulator</h1>
            <p id="welcome-subtitle">OpenComputers Emulator · Web Control Panel v2.0</p>
            <p class="hint" id="welcome-hint">Select a VM from the left, or click "New VM" to begin.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部状态栏 -->
    <footer class="status-bar">
      <span id="status-text">加载虚拟机列表失败: Failed to fetch</span>
      <span class="status-right" id="status-right"></span>
    </footer>

    <!-- 手机端侧边栏抽屉的遮罩 (点击关闭抽屉) -->
    <div class="nav-scrim" data-action="close-nav"></div>
  </div>

  <!-- 模态对话框容器 -->
  <div id="modal-container" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modal-title">标题</h3>
        <button class="modal-close" data-action="modal-close" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <script src="errorReporter.js?v=1"></script>
  <script src="i18n.js?v=8"></script>
  <script src="app.js?v=11"></script>
  <script src="wizard.js?v=3"></script>
  <script src="exportWizard.js?v=2"></script>
  <script src="console.js?v=50"></script>
  <script src="diskEditor.js?v=3"></script>


</body></html>
